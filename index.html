<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hand-Tracked 3D Particle Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; box-sizing: border-box; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Video feed feedback */
        #video-feedback {
            position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px;
            border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20; background: #000;
            transform: scaleX(-1); /* Mirror */
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; }

        /* Loader & Start Screen */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.9); z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        /* Magical glowing text effect */
        .glow-text {
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <!-- Start & Loading Screen -->
    <div id="overlay" class="pointer-events-auto">
        <div class="glass-panel p-10 max-w-lg text-center shadow-2xl relative">
            <h1 class="text-4xl font-bold mb-2 glow-text tracking-wider">GESTURE UNIVERSE</h1>
            
            <p class="text-xs text-blue-400 font-bold tracking-[0.2em] uppercase mb-8 glow-text">Developed by WURLI</p>
            
            <p class="text-gray-300 mb-8 text-sm leading-relaxed">
                Control a 3D particle system with your hands.<br><br>
                ✋ <b>Move hand</b> to rotate.<br>
                🤏 <b>Pinch</b> to expand/compress particles.<br>
                ✊ <b>Make a Fist</b> to change shapes.
            </p>
            <button id="start-btn" class="bg-white text-black font-semibold py-3 px-8 rounded-full hover:bg-gray-200 transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(255,255,255,0.4)]">
                Start Experience
            </button>
            <div id="loading-text" class="hidden mt-4 text-sm text-gray-400 animate-pulse">
                Initializing AI Tracking & 3D Engine...
            </div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="flex justify-end items-start">
            <div class="glass-panel px-4 py-2 text-right">
                <p id="status" class="text-sm font-semibold text-yellow-400 animate-pulse">Waiting for Hand...</p>
            </div>
        </div>
    </div>

    <!-- Mini Camera Feedback -->
    <div id="video-feedback">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script>
        // --- 3D PARTICLE ENGINE --- //
        const PARTICLE_COUNT = 15000;
        let scene, camera, renderer, particles, geometry;
        let positions = new Float32Array(PARTICLE_COUNT * 3);
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let colors = new Float32Array(PARTICLE_COUNT * 3);
        let baseColors = new Float32Array(PARTICLE_COUNT * 3);
        
        // Physics / Interaction variables
        let currentShapeIndex = 0;
        let shapes = ['Sphere', 'Heart', 'Flower', 'Saturn', 'Fireworks'];
        let expansionFactor = 1.0;
        let targetRotation = { x: 0, y: 0 };
        let baseHue = 0.6;
        let isFireworks = false;

        // --- Smooth Tracking Variables --- //
        // These act as low-pass filters to remove camera noise
        let smoothedHandX = 0.5;
        let smoothedHandY = 0.5;
        let smoothedPinchDist = 0.15;

        // Shape Generation Functions
        function generateSphere() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const r = 10;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                targetPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                targetPositions[i * 3 + 2] = r * Math.cos(phi);
            }
            isFireworks = false;
        }

        function generateHeart() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                // Parametric heart equation
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const z = (Math.random() - 0.5) * 4; // Add some depth volume
                // Scale it to fit our view
                targetPositions[i * 3] = x * 0.6;
                targetPositions[i * 3 + 1] = y * 0.6;
                targetPositions[i * 3 + 2] = z;
            }
            isFireworks = false;
        }

        function generateFlower() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 2;
                // Rose curve (k=4 petals, but in 3D using spherical coords)
                const r = 12 * Math.cos(4 * theta) * Math.sin(phi);
                targetPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                targetPositions[i * 3 + 2] = r * Math.cos(phi);
            }
            isFireworks = false;
        }

        function generateSaturn() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (Math.random() > 0.4) {
                    // Planet body
                    const r = 6;
                    const theta = 2 * Math.PI * Math.random();
                    const phi = Math.acos(2 * Math.random() - 1);
                    targetPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    targetPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    targetPositions[i * 3 + 2] = r * Math.cos(phi);
                } else {
                    // Rings
                    const r = 9 + Math.random() * 8;
                    const theta = 2 * Math.PI * Math.random();
                    targetPositions[i * 3] = r * Math.cos(theta);
                    targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.5; // Thin flat ring
                    targetPositions[i * 3 + 2] = r * Math.sin(theta);
                }
            }
            isFireworks = false;
        }

        function generateFireworks() {
            isFireworks = true;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Initialize at center
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = 0;
                
                // Target is a fast outward trajectory
                const r = 25 + Math.random() * 15;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                targetPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + (Math.random() * 5); // Add slight gravity/upward bias
                targetPositions[i * 3 + 2] = r * Math.cos(phi);
            }
        }

        const generators = [generateSphere, generateHeart, generateFlower, generateSaturn, generateFireworks];

        // Create a glowing circular texture procedurally to avoid external loading issues
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.4, 'rgba(128, 128, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            
            // Initialize random positions
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 40;
                colors[i] = Math.random() * 0.5 + 0.5;
                baseColors[i] = colors[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.8,
                map: createParticleTexture(),
                transparent: true,
                opacity: 0.8,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Set initial shape
            generators[currentShapeIndex]();

            window.addEventListener('resize', onWindowResize, false);
            animateThreeJS();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);

            // Double smoothed rotation based on hand tracking. 
            // Input is already smoothed, so we can make this snappier (0.1 instead of 0.05)
            particles.rotation.y += (targetRotation.y - particles.rotation.y) * 0.1;
            particles.rotation.x += (targetRotation.x - particles.rotation.x) * 0.1;

            // Optional slow auto-rotation
            particles.rotation.y += 0.002;

            const positionsArr = geometry.attributes.position.array;
            const colorsArr = geometry.attributes.color.array;
            
            // Color pulsing
            const colorShift = new THREE.Color().setHSL(baseHue, 0.8, 0.6);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                
                if (isFireworks) {
                    // Explode outward
                    positionsArr[i3] += (targetPositions[i3] * expansionFactor - positionsArr[i3]) * 0.02;
                    positionsArr[i3+1] += (targetPositions[i3+1] * expansionFactor - positionsArr[i3+1]) * 0.02;
                    positionsArr[i3+2] += (targetPositions[i3+2] * expansionFactor - positionsArr[i3+2]) * 0.02;
                    
                    // Reset particles that went too far to create continuous fireworks
                    if (Math.abs(positionsArr[i3]) > 20 * expansionFactor || Math.random() > 0.99) {
                        positionsArr[i3] = 0; positionsArr[i3+1] = 0; positionsArr[i3+2] = 0;
                    }
                } else {
                    // Lerp towards target shape with expansion factor
                    const targetX = targetPositions[i3] * expansionFactor;
                    const targetY = targetPositions[i3+1] * expansionFactor;
                    const targetZ = targetPositions[i3+2] * expansionFactor;

                    positionsArr[i3] += (targetX - positionsArr[i3]) * 0.05;
                    positionsArr[i3+1] += (targetY - positionsArr[i3+1]) * 0.05;
                    positionsArr[i3+2] += (targetZ - positionsArr[i3+2]) * 0.05;

                    // Add slight random noise based on expansion to make it feel "alive"
                    if (expansionFactor > 1.2) {
                        positionsArr[i3] += (Math.random() - 0.5) * 0.2;
                        positionsArr[i3+1] += (Math.random() - 0.5) * 0.2;
                        positionsArr[i3+2] += (Math.random() - 0.5) * 0.2;
                    }
                }

                // Dynamic coloring based on gesture & base color
                if (i % 3 === 0) { // Optimize color updates
                    colorsArr[i3] = colorShift.r * baseColors[i3];
                    colorsArr[i3+1] = colorShift.g * baseColors[i3+1];
                    colorsArr[i3+2] = colorShift.b * baseColors[i3+2];
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        function switchShape() {
            currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
            
            // Randomize color hue on shape switch
            baseHue = Math.random();
            
            generators[currentShapeIndex]();
        }

        // --- HAND TRACKING (MediaPipe) --- //
        const videoElement = document.getElementById('webcam');
        let lastFistTime = 0;
        let isHandDetected = false;

        function calculateDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        function onResults(results) {
            const statusEl = document.getElementById('status');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                if (!isHandDetected) {
                    isHandDetected = true;
                    statusEl.innerText = "Hand Tracked ✨";
                    statusEl.classList.remove('text-yellow-400');
                    statusEl.classList.add('text-green-400');
                }

                const landmarks = results.multiHandLandmarks[0];

                // 1. Position Mapping -> Smooth the raw coordinates FIRST
                const rawHandX = landmarks[0].x; 
                const rawHandY = landmarks[0].y;
                
                // Exponential Moving Average (EMA) to filter out jittery hand movements
                smoothedHandX += (rawHandX - smoothedHandX) * 0.3; // Lower value = smoother but more delayed
                smoothedHandY += (rawHandY - smoothedHandY) * 0.3;

                // Map smoothed coordinates to rotation
                targetRotation.y = (smoothedHandX - 0.5) * Math.PI * 2;
                targetRotation.x = (smoothedHandY - 0.5) * Math.PI;

                // Color tinting based on horizontal position
                baseHue += (smoothedHandX - baseHue) * 0.05; 

                // 2. Pinch Detection -> Smooth the pinch distance calculation
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const rawPinchDist = calculateDistance(thumbTip, indexTip);
                
                // Smooth the distance measurement so the particles don't "flutter"
                smoothedPinchDist += (rawPinchDist - smoothedPinchDist) * 0.2;
                
                // Map pinch distance (approx 0.02 to 0.3) to expansion factor (0.5 to 3.0)
                let targetExpansion = 1.0;
                if (smoothedPinchDist < 0.05) {
                    targetExpansion = 0.5; // Compressed
                } else if (smoothedPinchDist > 0.15) {
                    targetExpansion = 1.0 + (smoothedPinchDist - 0.15) * 5; // Expanded, up to ~2.5
                }
                
                // Final expansion smoothing
                expansionFactor += (targetExpansion - expansionFactor) * 0.1;

                // 3. Fist Detection -> Stricter rules to prevent misfires
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                
                // Lowered the distance threshold from 0.25 to 0.18 for a stricter "fist" calculation
                const isFist = calculateDistance(indexTip, wrist) < 0.18 &&
                               calculateDistance(middleTip, wrist) < 0.18 &&
                               calculateDistance(pinkyTip, wrist) < 0.18;

                const now = Date.now();
                if (isFist && (now - lastFistTime > 1500)) { // 1.5s cooldown
                    switchShape();
                    lastFistTime = now;
                    
                    // Visual feedback for switch
                    statusEl.innerText = "Shape Morph! 🔮";
                    statusEl.classList.replace('text-green-400', 'text-purple-400');
                    setTimeout(() => {
                        statusEl.innerText = "Hand Tracked ✨";
                        statusEl.classList.replace('text-purple-400', 'text-green-400');
                    }, 1000);
                }

            } else {
                if (isHandDetected) {
                    isHandDetected = false;
                    statusEl.innerText = "Waiting for Hand...";
                    statusEl.classList.remove('text-green-400');
                    statusEl.classList.add('text-yellow-400');
                    
                    // Return to default smoothly
                    targetRotation.x = 0;
                    targetRotation.y = 0;
                    expansionFactor += (1.0 - expansionFactor) * 0.05;
                }
            }
        }

        async function initHandTracking() {
            const hands = n
